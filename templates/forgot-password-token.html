{% extends "base.html" %}
{% block content %}
<h2>Password reset</h2>
<h5>Enter the token received on your email ({{ email }}):</h5>
    <form method="post" action="forgot-password-token-verification">
    <label>Token</label><br/>
    <input name="input_token" type="text"><br/><br/>
        <input name="email" type="hidden" value="{{ email }}"><br/><br/>
    <button type="submit">Verify token</button>
    </form>
    <br>
    <h5>The token is available 15 minutes.</h5>

{% endblock %}
