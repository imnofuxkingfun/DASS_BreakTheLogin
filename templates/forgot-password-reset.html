{% extends "base.html" %}
{% block content %}
<h2>Password reset</h2>
<h5>Reset account password ({{ email }}):</h5>
    <form method="post" action="forgot-password-reset">
    <label>New password</label><br/>
    <input name="new_password" type="text"><br/><br/>
        <input name="email" type="hidden" value="{{ email }}"><br/><br/>
    <button type="submit">Reset password</button>
    </form>

{% endblock %}
